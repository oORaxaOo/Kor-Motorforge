name: CI

on:
  push:
    branches: [main, "work/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test (Ubuntu)
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build --parallel 2

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Verify machine-readable capabilities and project commands
        run: |
          ./build/motorforge capabilities --json > capabilities.json
          python3 -c 'import json; d=json.load(open("capabilities.json")); names={c["name"] for c in d["commands"]}; assert d["engine"]["name"] == "Kor Motorforge"; assert {"validate", "init", "spritegen"} <= names'
          ./build/motorforge validate examples/empty-project --json > validation.json
          python3 -c 'import json; d=json.load(open("validation.json")); assert d["ok"] is True; assert d["project"]["id"] == "my-first-game"'
          ./build/motorforge init "$RUNNER_TEMP/motorforge-ci-project" --name "CI Test Project" --json > created.json
          python3 -c 'import json; d=json.load(open("created.json")); assert d["ok"] is True; assert d["project"]["id"] == "ci-test-project"'
          ./build/motorforge validate "$RUNNER_TEMP/motorforge-ci-project" --json > created-validation.json
          python3 -c 'import json; d=json.load(open("created-validation.json")); assert d["ok"] is True'
          ./build/motorforge spritegen "$RUNNER_TEMP/motorforge-ci-sprite.svg" --seed 42 --size 64 --json > sprite.json
          python3 -c 'import json; d=json.load(open("sprite.json")); assert d["ok"] is True; assert d["asset"]["seed"] == 42'
          python3 -c 'from pathlib import Path; p=Path("'"$RUNNER_TEMP"'/motorforge-ci-sprite.svg"); assert p.read_text().startswith("<svg ")'

      - name: Verify JSON source files
        run: |
          python3 -c 'import json; json.load(open("schemas/project.schema.json")); json.load(open("examples/empty-project/project.json"))'
